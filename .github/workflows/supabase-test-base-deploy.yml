name: MAINT - Rebuild TEST baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test-base:
    name: Deploy TEST-BASE to Supabase TEST
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install PostgreSQL client
        shell: bash
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo "PostgreSQL client already available: $(psql --version)"
            exit 0
          fi
          
          for attempt in 1 2 3 4; do
            echo "Installing PostgreSQL client (attempt $attempt/4)..."
            if sudo apt-get -o Acquire::Retries=3 update && \
               sudo apt-get -o Acquire::Retries=3 install -y postgresql-client; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "ERROR: unable to install PostgreSQL client after 4 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          
          command -v psql >/dev/null 2>&1 || { echo "ERROR: psql is still unavailable after installation." >&2; exit 1; }
          psql --version
      - name: Validate TEST-BASE seed
        shell: bash
        run: |
          set -euo pipefail

          test -s supabase/seed/test-base.sql

          echo "TEST-BASE seed found:"
          wc -l supabase/seed/test-base.sql

          # Salvaguardas basicas: este seed no debe contener
          # tablas personales/operativas.
          if grep -Eiq \
            'insert[[:space:]]+into[[:space:]]+public\.(personas|jugadores|entrenadores|inscripciones|documentos|pagos_inscripcion|notificaciones_salida)' \
            supabase/seed/test-base.sql; then
            echo "ERROR: TEST-BASE contiene INSERT sobre tablas personales u operativas."
            exit 1
          fi

          echo "Seed validation completed."

      - name: Verify TEST schema is ready
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$TEST_DB_URL"

          TABLES_COUNT=$(psql "$TEST_DB_URL" -X -A -t -v ON_ERROR_STOP=1 \
            -c "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE';")

          echo "Current TEST public tables: $TABLES_COUNT"

          if [ "$TABLES_COUNT" != "38" ]; then
            echo "ERROR: TEST does not contain the expected 38 public tables."
            exit 1
          fi

          echo "TEST pre-deployment validation completed."

      - name: Deploy TEST-BASE
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail

          psql "$TEST_DB_URL" \
            -X \
            -v ON_ERROR_STOP=1 \
            -f supabase/seed/test-base.sql

      - name: Validate TEST-BASE deployment
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail

          RESULT=$(psql "$TEST_DB_URL" -X -A -F ',' -t -v ON_ERROR_STOP=1 <<'SQL'
          select 'roles', count(*) from public.roles
          union all
          select 'temporadas', count(*) from public.temporadas
          union all
          select 'categorias', count(*) from public.categorias
          union all
          select 'equipos', count(*) from public.equipos
          union all
          select 'reglas_categoria_temporada', count(*) from public.reglas_categoria_temporada
          union all
          select 'configuracion_visual_club', count(*) from public.configuracion_visual_club
          order by 1;
          SQL
          )

          echo "$RESULT"

          assert_count () {
            local table="$1"
            local expected="$2"
            local actual

            actual=$(echo "$RESULT" | awk -F',' -v t="$table" '$1 == t {print $2}')

            if [ "$actual" != "$expected" ]; then
              echo "ERROR: $table expected $expected rows but found ${actual:-missing}."
              exit 1
            fi
          }

          assert_count roles 5
          assert_count temporadas 1
          assert_count categorias 8
          assert_count equipos 23
          assert_count reglas_categoria_temporada 8
          assert_count configuracion_visual_club 1

          echo "TEST-BASE deployment validated successfully."

      - name: Deployment completed
        run: |
          echo "Supabase TEST-BASE deployment completed."
          echo "Only non-personal master data has been loaded."
          echo "TEST-BASE does not create or reset Personas/Auth users."
          echo "TEST-M has not been loaded."
          echo "Cron remains disabled."
