name: MAINT - Compare environment states

on:
  workflow_dispatch:
    inputs:
      develop_ref:
        description: Repository ref expected in DEVELOP
        required: true
        type: choice
        options: [develop, test, main]
        default: develop
      test_ref:
        description: Repository ref expected in TEST
        required: true
        type: choice
        options: [test, develop, main]
        default: test
      demo_ref:
        description: Repository ref expected in DEMO
        required: true
        type: choice
        options: [main, test, develop]
        default: main

permissions:
  contents: read

env:
  DEVELOP_FRONTEND_URL: https://ansantosci.github.io/Yebenes/develop/
  TEST_FRONTEND_URL: https://ansantosci.github.io/Yebenes/test/
  DEMO_FRONTEND_URL: https://ansantosci.github.io/Yebenes/

jobs:
  compare:
    name: Read-only three-environment drift check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout DEVELOP expected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.develop_ref }}
          path: expected-develop
          fetch-depth: 0

      - name: Checkout TEST expected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.test_ref }}
          path: expected-test
          fetch-depth: 0

      - name: Checkout DEMO expected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.demo_ref }}
          path: expected-demo
          fetch-depth: 0

      - name: Install PostgreSQL client
        shell: bash
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo "PostgreSQL client already available: $(psql --version)"
            exit 0
          fi
          
          for attempt in 1 2 3 4; do
            echo "Installing PostgreSQL client (attempt $attempt/4)..."
            if sudo apt-get -o Acquire::Retries=3 update && \
               sudo apt-get -o Acquire::Retries=3 install -y postgresql-client; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "ERROR: unable to install PostgreSQL client after 4 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          
          command -v psql >/dev/null 2>&1 || { echo "ERROR: psql is still unavailable after installation." >&2; exit 1; }
          psql --version
      - name: Compare DEVELOP, TEST and DEMO state
        shell: bash
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
          SUPABASE_DEMO_DB_URL: ${{ secrets.SUPABASE_DEMO_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_TEST_DB_URL" || { echo 'Missing SUPABASE_TEST_DB_URL.' >&2; exit 1; }
          test -n "$SUPABASE_DEMO_DB_URL" || { echo 'Missing SUPABASE_DEMO_DB_URL.' >&2; exit 1; }
          python3 expected-develop/scripts/check-environment-drift.py \
            --develop-repo expected-develop \
            --test-repo expected-test \
            --demo-repo expected-demo \
            --test-db-url "$SUPABASE_TEST_DB_URL" \
            --demo-db-url "$SUPABASE_DEMO_DB_URL" \
            --develop-frontend-url "$DEVELOP_FRONTEND_URL" \
            --test-frontend-url "$TEST_FRONTEND_URL" \
            --demo-frontend-url "$DEMO_FRONTEND_URL" \
            --output environment-drift-report.json

      - name: Publish drift summary
        shell: bash
        run: |
          echo '### Three-environment drift report' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat environment-drift-report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: environment-drift-report-${{ github.run_number }}
          path: environment-drift-report.json
          if-no-files-found: error
          retention-days: 90
