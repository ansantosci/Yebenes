name: Validate repository architecture

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Validate repository responsibilities and secret hygiene
        run: python3 scripts/validate-architecture.py
