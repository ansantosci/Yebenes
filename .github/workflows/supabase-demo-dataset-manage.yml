name: INTERNAL - Manage DEMO synthetic data

on:
  workflow_call:
    inputs:
      source_ref:
        description: Repository branch containing the DEMO dataset scripts
        required: true
        type: string
        default: develop
      target:
        description: Database where the controlled DEMO dataset will be exercised
        required: true
        type: string
        default: TEST
      action:
        description: Data action
        required: true
        type: string
        default: KEEP
      demo_confirmation:
        description: For DEMO only, type MANAGE_DEMO_DATA
        required: false
        type: string
      rehearsal_confirmation:
        description: For TEST rehearsal only, type REHEARSE_DEMO_ON_TEST
        required: false
        type: string

permissions:
  contents: read
concurrency:
  group: yebenes-demo-dataset-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-26.04
    steps:
      - name: Validate environment guardrails
        shell: bash
        run: |
          set -euo pipefail
          ref='${{ inputs.source_ref }}'
          target='${{ inputs.target }}'
          if [ "$target" = 'TEST' ]; then
            case "$ref" in develop|test) ;; *) echo 'TEST dataset rehearsal requires develop or test.' >&2; exit 1;; esac
            [ '${{ inputs.rehearsal_confirmation }}' = 'REHEARSE_DEMO_ON_TEST' ] || { echo 'Type REHEARSE_DEMO_ON_TEST to exercise DEMO-S on TEST.' >&2; exit 1; }
          else
            [ "$ref" = 'main' ] || { echo 'DEMO dataset requires source_ref=main.' >&2; exit 1; }
            if [ '${{ inputs.action }}' = 'RESET_AND_LOAD' ]; then
              [ '${{ inputs.demo_confirmation }}' = 'MANAGE_DEMO_DATA' ] || { echo 'DEMO RESET requires MANAGE_DEMO_DATA confirmation.' >&2; exit 1; }
            fi
          fi
      - name: Checkout selected source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
      - name: KEEP current data
        if: ${{ inputs.action == 'KEEP' }}
        run: echo "KEEP selected. No database changes performed."
      - name: Install PostgreSQL client
        if: ${{ inputs.action == 'RESET_AND_LOAD' }}
        shell: bash
        run: |
          if command -v psql >/dev/null 2>&1; then psql --version; exit 0; fi
          for attempt in 1 2 3 4; do
            echo "Installing PostgreSQL client (attempt $attempt/4)..."
            if sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y postgresql-client; then break; fi
            [ "$attempt" -lt 4 ] || { echo 'ERROR: unable to install PostgreSQL client.' >&2; exit 1; }
            sleep $((attempt * 10))
          done
          command -v psql >/dev/null 2>&1
      - name: Select target database
        if: ${{ inputs.action == 'RESET_AND_LOAD' }}
        id: db
        shell: bash
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
          DEMO_DB_URL: ${{ secrets.SUPABASE_DEMO_DB_URL }}
        run: |
          set -euo pipefail
          if [ '${{ inputs.target }}' = 'TEST' ]; then DB_URL="$TEST_DB_URL"; else DB_URL="$DEMO_DB_URL"; fi
          [ -n "$DB_URL" ] || { echo 'Database URL secret is empty.' >&2; exit 1; }
          echo "db_url=$DB_URL" >> "$GITHUB_OUTPUT"
      - name: Validate canonical dataset sources
        if: ${{ inputs.action == 'RESET_AND_LOAD' }}
        shell: bash
        env:
          DB_URL: ${{ steps.db.outputs.db_url }}
        run: |
          set -euo pipefail
          test -s scripts/render-demo-dataset.mjs
          test -s supabase/seed/test-data/01-reset-test-s.sql
          test -s supabase/seed/demo-data/10_demo_s_v1_baseline.sql
          test -s supabase/seed/test-data/10-test-s-v1-baseline.sql
          test -s supabase/seed/demo-data/20_demo_access_operational_matrix.sql
          test -s supabase/seed/test-access/00-test-access-personas.sql
          test -s supabase/seed/demo-access/00-demo-access-personas.sql
          test -s supabase/seed/test-data/15-authenticated-families.sql
          test -s supabase/seed/demo-data/15-authenticated-families.sql
          test -s scripts/bootstrap-test-access.mjs
          test -s scripts/bootstrap-demo-access.mjs
          test -s supabase/seed/common/05-align-2026-27-structure.sql
          test -s supabase/seed/common/10-rffm-2026-27.sql
          test -s supabase/seed/test-data/scenarios/economia-v1.sql
          test -s supabase/seed/test-data/scenarios/equipaciones-v1.sql
          test -s supabase/seed/test-data/scenarios/notifications-v1.sql
          test -s supabase/seed/test-data/scenarios/completo-v1.sql
          psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select to_regclass('private.demo_datasets'), to_regclass('private.demo_dataset_entities');" | grep -q 'private.demo_datasets.*private.demo_dataset_entities'
      - name: Ensure canonical coach coverage
        shell: bash
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/seed/common/20-coach-coverage.sql
      - name: Render canonical TEST teardown and scenarios for DEMO namespace
        if: ${{ inputs.action == 'RESET_AND_LOAD' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .generated/demo-dataset
          node scripts/render-demo-dataset.mjs --kind reset --input supabase/seed/test-data/01-reset-test-s.sql --output .generated/demo-dataset/01-reset-demo-s.sql
          node scripts/render-demo-dataset.mjs --kind parity --input supabase/seed/test-data/10-test-s-v1-baseline.sql --output .generated/demo-dataset/15-test-baseline-parity.sql
          for scenario in economia-v1 equipaciones-v1 notifications-v1 completo-v1; do
            node scripts/render-demo-dataset.mjs --kind scenario --input "supabase/seed/test-data/scenarios/${scenario}.sql" --output ".generated/demo-dataset/${scenario}.sql"
          done
          ! grep -R -E "private\.test_(dataset_entities|datasets|uuid)|'TEST-S'|private\.test_set_reception_delete_guard" .generated/demo-dataset
      - name: Snapshot protected login identities
        if: ${{ inputs.action == 'RESET_AND_LOAD' }}
        shell: bash
        env:
          DB_URL: ${{ steps.db.outputs.db_url }}
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 \
            -c "select id,auth_user_id from public.personas where auth_user_id is not null order by id,auth_user_id" > protected-auth-before.txt
          echo "Protected Auth mappings before reset: $(wc -l < protected-auth-before.txt)"
          test -s protected-auth-before.txt
      - name: Clear TEST-S before DEMO rehearsal
        if: ${{ inputs.action == 'RESET_AND_LOAD' && inputs.target == 'TEST' }}
        shell: bash
        env:
          DB_URL: ${{ steps.db.outputs.db_url }}
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/test-support/00-test-infrastructure.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/test-data/01-reset-test-s.sql
      - name: Bootstrap target ACCESS identities
        if: ${{ inputs.action == 'RESET_AND_LOAD' }}
        shell: bash
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          TEST_APP_USER_PASSWORD: ${{ secrets.TEST_APP_USER_PASSWORD }}
          SUPABASE_DEMO_URL: ${{ secrets.SUPABASE_DEMO_URL }}
          SUPABASE_DEMO_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEMO_SERVICE_ROLE_KEY }}
          DEMO_APP_USER_PASSWORD: ${{ secrets.DEMO_APP_USER_PASSWORD }}
          DB_URL: ${{ steps.db.outputs.db_url }}
        run: |
          set -euo pipefail
          if [ '${{ inputs.target }}' = 'TEST' ]; then
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/test-access/00-test-access-personas.sql
            node scripts/bootstrap-test-access.mjs
          else
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/demo-access/00-demo-access-personas.sql
            node scripts/bootstrap-demo-access.mjs
          fi
      - name: Reset and load DEMO-S COMPLETO
        if: ${{ inputs.action == 'RESET_AND_LOAD' }}
        shell: bash
        env:
          DB_URL: ${{ steps.db.outputs.db_url }}
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .generated/demo-dataset/01-reset-demo-s.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/common/05-align-2026-27-structure.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/demo-data/10_demo_s_v1_baseline.sql
          if [ '${{ inputs.target }}' = 'TEST' ]; then
            # Rehearsal runs on TEST Auth. Link family cases through TEST-ACCESS.
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/test-data/15-authenticated-families.sql
          else
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/demo-data/15-authenticated-families.sql
          fi
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/common/20-coach-coverage.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .generated/demo-dataset/15-test-baseline-parity.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/common/10-rffm-2026-27.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/demo-data/20_demo_access_operational_matrix.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .generated/demo-dataset/economia-v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .generated/demo-dataset/equipaciones-v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .generated/demo-dataset/notifications-v1.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .generated/demo-dataset/completo-v1.sql
      - name: Verify protected login identities survived unchanged
        if: ${{ always() && inputs.action == 'RESET_AND_LOAD' }}
        shell: bash
        env:
          DB_URL: ${{ steps.db.outputs.db_url }}
        run: |
          set -euo pipefail
          test -s protected-auth-before.txt
          psql "$DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 \
            -c "select id,auth_user_id from public.personas where auth_user_id is not null order by id,auth_user_id" > protected-auth-after.txt
          missing=$(comm -23 <(sort protected-auth-before.txt) <(sort protected-auth-after.txt) || true)
          if [ -n "$missing" ]; then
            echo 'Protected login mappings missing or changed:' >&2
            echo "$missing" >&2
            exit 1
          fi
          echo "Protected Auth mappings preserved. New mappings are allowed."
      - name: Validate DEMO-S richness, RFFM and safety
        if: ${{ inputs.action == 'RESET_AND_LOAD' }}
        shell: bash
        env:
          DB_URL: ${{ steps.db.outputs.db_url }}
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -A -F ',' -v ON_ERROR_STOP=1 <<'SQL'
          select 'dataset',id,version,scenario from private.demo_datasets where id='DEMO-S';
          select 'players',count(*) from public.jugadores j join private.demo_dataset_entities e on e.dataset_id='DEMO-S' and e.table_name='jugadores' and e.entity_id=j.id;
          select 'coaches',count(*) from public.entrenadores c join private.demo_dataset_entities e on e.dataset_id='DEMO-S' and e.table_name='entrenadores' and e.entity_id=c.id;
          select 'economy_charges',count(*) from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='economia_cargos';
          select 'equipment_needs',count(*) from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='equipacion_necesidades';
          select 'equipment_orders',count(*) from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='equipacion_pedidos';
          select 'notifications',count(*) from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='notificaciones_salida';
          select 'active_participations',count(*) from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='persona_participaciones_temporada';
          select 'team_schedules',count(*) from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='horarios_equipo';
          select 'future_multifacet',count(*) from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='personas' and entity_id in (private.demo_uuid('particip:carlos'),private.demo_uuid('particip:pablo'),private.demo_uuid('particip:lucia'));
          select 'rffm',count(*) from public.equipo_integraciones_federacion i join public.equipos e on e.id=i.equipo_id where i.proveedor='RFFM' and i.activo and i.config->>'season_id'='22' and e.temporada_id='f6b07c5c-9f57-44f4-a20d-189ab8608eac'::uuid;
          do $$
          begin
            if (select scenario from private.demo_datasets where id='DEMO-S') <> 'COMPLETO' then raise exception 'DEMO-S expected COMPLETO scenario'; end if;
            if (select count(*) from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='jugadores') < 115 then raise exception 'DEMO-S expected at least 115 synthetic players'; end if;
            if (select count(*) from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='entrenadores') < 28 then raise exception 'DEMO-S expected at least 28 synthetic coaches'; end if;
            if (select count(*) from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='horarios_equipo') < 23 then raise exception 'DEMO-S baseline parity missing team schedules'; end if;
            if (select count(*) from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='personas' and entity_id in (private.demo_uuid('particip:carlos'),private.demo_uuid('particip:pablo'),private.demo_uuid('particip:lucia'))) <> 3 then raise exception 'DEMO-S baseline parity missing future multifacet fixture'; end if;
            if not exists (select 1 from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='economia_cargos') then raise exception 'DEMO-S economy coverage missing'; end if;
            if not exists (select 1 from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='equipacion_necesidades') then raise exception 'DEMO-S equipment coverage missing'; end if;
            if not exists (select 1 from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='equipacion_pedidos') then raise exception 'DEMO-S equipment order coverage missing'; end if;
            if not exists (select 1 from private.demo_dataset_entities where dataset_id='DEMO-S' and table_name='notificaciones_salida') then raise exception 'DEMO-S notification coverage missing'; end if;
            if (select count(*) from public.equipo_integraciones_federacion i join public.equipos e on e.id=i.equipo_id where i.proveedor='RFFM' and i.activo and i.config->>'season_id'='22' and e.temporada_id='f6b07c5c-9f57-44f4-a20d-189ab8608eac'::uuid) <> 23 then raise exception 'DEMO-S RFFM coverage expected 23/23'; end if;
            if exists (select 1 from private.demo_dataset_entities e join public.personas p on p.id=e.entity_id where e.dataset_id='DEMO-S' and e.table_name='personas' and p.auth_user_id is not null) then raise exception 'DEMO-S safety contract failed: dataset-owned Persona has Auth'; end if;
          end $$;
          SQL
      - name: Rehearsal reminder
        if: ${{ inputs.action == 'RESET_AND_LOAD' && inputs.target == 'TEST' }}
        run: echo "DEMO rehearsal succeeded on TEST. Restore TEST afterwards with 02 - Manage synthetic data / TEST / RESET / COMPLETO."
