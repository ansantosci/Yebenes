name: Manage Supabase TEST dataset
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Repository branch containing TEST dataset scripts
        required: true
        type: choice
        options: [develop, test]
        default: develop
      action:
        description: Data action
        required: true
        type: choice
        options: [KEEP, RESET]
        default: KEEP
      scenario:
        description: Scenario applied after RESET
        required: true
        type: choice
        options: [BASELINE, NOTIFICATIONS]
        default: BASELINE
permissions:
  contents: read
jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: KEEP current TEST data
        if: ${{ inputs.action == 'KEEP' }}
        run: echo "KEEP selected. Source=${{ inputs.source_ref }}. No database changes performed."
      - name: Install PostgreSQL client
        if: ${{ inputs.action == 'RESET' }}
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate RESET inputs and scripts
        if: ${{ inputs.action == 'RESET' }}
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$TEST_DB_URL"
          test -s supabase/seed/test-data/00-infrastructure.sql
          test -s supabase/seed/test-data/01-reset-test-s.sql
          test -s supabase/seed/test-data/10-test-s-v1-baseline.sql
          if [ "${{ inputs.scenario }}" = "NOTIFICATIONS" ]; then
            test -s supabase/seed/test-data/scenarios/notifications-v1.sql
          fi
      - name: Reset and load TEST-S v1
        if: ${{ inputs.action == 'RESET' }}
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          set -euo pipefail
          psql "$TEST_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/test-data/00-infrastructure.sql
          psql "$TEST_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/test-data/01-reset-test-s.sql
          psql "$TEST_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/test-data/10-test-s-v1-baseline.sql
          if [ "${{ inputs.scenario }}" = "NOTIFICATIONS" ]; then
            psql "$TEST_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/seed/test-data/scenarios/notifications-v1.sql
          fi
      - name: Validate dataset
        if: ${{ inputs.action == 'RESET' }}
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          set -euo pipefail
          psql "$TEST_DB_URL" -X -A -F ',' -v ON_ERROR_STOP=1 <<'SQL'
          select 'dataset',id,version,scenario from private.test_datasets where id='TEST-S';
          select 'players',count(*) from public.inscripciones i join private.test_dataset_entities e on e.dataset_id='TEST-S' and e.table_name='inscripciones' and e.entity_id=i.id;
          select 'coaches',count(*) from public.entrenador_temporadas et join private.test_dataset_entities e on e.dataset_id='TEST-S' and e.table_name='entrenador_temporadas' and e.entity_id=et.id;
          select 'tutors',count(*) from private.test_dataset_entities e where e.dataset_id='TEST-S' and e.table_name='persona_roles' and e.entity_id in (select id from public.persona_roles where rol_id='5b569d29-62f1-40b9-bfb7-7a65f62ee8aa');
          select 'pending_notifications',count(*) from public.notificaciones_salida n join private.test_dataset_entities e on e.dataset_id='TEST-S' and e.table_name='notificaciones_salida' and e.entity_id=n.id where n.estado='pendiente';
          select 'access_operational_players',count(*) from private.test_access_identities a join public.jugadores j on j.persona_id=a.persona_id join public.inscripciones i on i.jugador_id=j.id where a.key in ('coach_player','adult_player','minor_player','multiprofile');
          select 'access_operational_coaches',count(*) from private.test_access_identities a join public.entrenadores c on c.persona_id=a.persona_id join public.entrenador_temporadas et on et.entrenador_id=c.id where a.key in ('coach','coach_player','multiprofile');
          select 'tutor_minor_link',count(*) from private.test_access_identities t join private.test_access_identities m on t.key='tutor' and m.key='minor_player' join public.jugadores j on j.persona_id=m.persona_id join public.representaciones_jugador r on r.jugador_id=j.id and r.representante_persona_id=t.persona_id where r.fecha_hasta is null;
          select 'coach_player_dual',count(*) from private.test_access_identities a join public.jugadores j on j.persona_id=a.persona_id join public.entrenadores c on c.persona_id=a.persona_id where a.key='coach_player';
          select 'multiprofile_dual',count(*) from private.test_access_identities a join public.jugadores j on j.persona_id=a.persona_id join public.entrenadores c on c.persona_id=a.persona_id where a.key='multiprofile';
          select 'access_facets_not_owned_by_test_s',count(*) from private.test_dataset_entities e where e.dataset_id='TEST-S' and ((e.table_name='jugadores' and e.entity_id in (select j.id from private.test_access_identities a join public.jugadores j on j.persona_id=a.persona_id)) or (e.table_name='entrenadores' and e.entity_id in (select c.id from private.test_access_identities a join public.entrenadores c on c.persona_id=a.persona_id)));
          do $$
          begin
            if (select count(*) from private.test_access_identities a join public.jugadores j on j.persona_id=a.persona_id join public.inscripciones i on i.jugador_id=j.id where a.key in ('coach_player','adult_player','minor_player','multiprofile')) <> 4 then raise exception 'TEST-ACCESS operational players invalid'; end if;
            if (select count(*) from private.test_access_identities a join public.entrenadores c on c.persona_id=a.persona_id join public.entrenador_temporadas et on et.entrenador_id=c.id where a.key in ('coach','coach_player','multiprofile')) <> 3 then raise exception 'TEST-ACCESS operational coaches invalid'; end if;
            if (select count(*) from private.test_access_identities t join private.test_access_identities m on t.key='tutor' and m.key='minor_player' join public.jugadores j on j.persona_id=m.persona_id join public.representaciones_jugador r on r.jugador_id=j.id and r.representante_persona_id=t.persona_id where r.fecha_hasta is null) <> 1 then raise exception 'TEST-ACCESS tutor/minor link invalid'; end if;
            if (select count(*) from private.test_dataset_entities e where e.dataset_id='TEST-S' and ((e.table_name='jugadores' and e.entity_id in (select j.id from private.test_access_identities a join public.jugadores j on j.persona_id=a.persona_id)) or (e.table_name='entrenadores' and e.entity_id in (select c.id from private.test_access_identities a join public.entrenadores c on c.persona_id=a.persona_id)))) <> 0 then raise exception 'TEST-ACCESS permanent facets must not be owned by TEST-S'; end if;
          end $$;
          SQL
