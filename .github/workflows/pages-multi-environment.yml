name: Deploy multi-environment GitHub Pages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - test
      - develop

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-multi-environment
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-main

      - name: Checkout test
        uses: actions/checkout@v4
        with:
          ref: test
          path: source-test

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: source-develop

      - name: Create Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site
          mkdir -p site/test
          mkdir -p site/develop

          # ============================================================
          # MAIN -> /
          # ============================================================

          cp source-main/index.html site/
          cp source-main/app.js site/
          cp source-main/styles.css site/
          cp source-main/manifest.webmanifest site/
          cp source-main/sw.js site/
          cp source-main/version.json site/

          if [ -f source-main/config.js ]; then
            cp source-main/config.js site/
          fi

          # ============================================================
          # TEST -> /test/
          # ============================================================

          cp source-test/index.html site/test/
          cp source-test/app.js site/test/
          cp source-test/styles.css site/test/
          cp source-test/manifest.webmanifest site/test/
          cp source-test/sw.js site/test/
          cp source-test/version.json site/test/

          if [ -f source-test/config.js ]; then
            cp source-test/config.js site/test/
          fi

          # ============================================================
          # DEVELOP -> /develop/
          # ============================================================

          cp source-develop/index.html site/develop/
          cp source-develop/app.js site/develop/
          cp source-develop/styles.css site/develop/
          cp source-develop/manifest.webmanifest site/develop/
          cp source-develop/sw.js site/develop/
          cp source-develop/version.json site/develop/

          if [ -f source-develop/config.js ]; then
            cp source-develop/config.js site/develop/
          fi

      - name: Validate MAIN
        shell: bash
        run: |
          set -euo pipefail

          test -s site/index.html
          test -s site/app.js
          test -s site/styles.css
          test -s site/version.json

          echo "MAIN validation completed."

      - name: Validate TEST
        shell: bash
        run: |
          set -euo pipefail

          test -s site/test/index.html
          test -s site/test/app.js
          test -s site/test/config.js

          grep -q "YEBENES_CONFIG" site/test/app.js
          grep -q "config.js" site/test/index.html
          grep -q "eenzhtnwnimpqurjpaok.supabase.co" site/test/config.js

          if grep -q "ypyzochuqtetddffohpv.supabase.co" site/test/app.js; then
            echo "ERROR: TEST app.js contains DEMO Supabase hardcoded."
            exit 1
          fi

          echo "TEST validation completed."

      - name: Validate DEVELOP
        shell: bash
        run: |
          set -euo pipefail

          test -s site/develop/index.html
          test -s site/develop/app.js
          test -s site/develop/config.js

          grep -q "YEBENES_CONFIG" site/develop/app.js
          grep -q "config.js" site/develop/index.html
          grep -q "eenzhtnwnimpqurjpaok.supabase.co" site/develop/config.js

          if grep -q "ypyzochuqtetddffohpv.supabase.co" site/develop/app.js; then
            echo "ERROR: DEVELOP app.js contains DEMO Supabase hardcoded."
            exit 1
          fi

          echo "DEVELOP validation completed."

      - name: Show build information
        shell: bash
        run: |
          echo "Workflow source branch: $GITHUB_REF_NAME"
          echo
          echo "Published structure:"
          echo "  /         <- main"
          echo "  /test/    <- test"
          echo "  /develop/ <- develop"
          echo
          echo "Deployment policy:"
          echo "  main    -> build + deploy"
          echo "  test    -> build only"
          echo "  develop -> build only"

      # El artefacto Pages solo es necesario cuando MAIN va a desplegar.
      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
