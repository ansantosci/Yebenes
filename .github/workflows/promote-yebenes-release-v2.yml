name: 01 - Promote Yebenes release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Promotion operation
        required: true
        type: choice
        options: [DRY_RUN, DEVELOP_TO_TEST, TEST_TO_DEMO]
        default: DRY_RUN
      confirmation:
        description: Promotion modes are locked in v2.1; DRY_RUN requires no confirmation.
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: yebenes-release-promotion
  cancel-in-progress: false
jobs:
  analyze:
    name: Analyze all environments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch environment branches
        run: git fetch origin develop test main --prune
      - name: Analyze three environment states
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: bash scripts/release/analyze-promotion.sh "$MODE" "$CONFIRMATION"
      - name: Enforce bootstrap lock
        if: ${{ inputs.mode != 'DRY_RUN' }}
        run: |
          echo "::error::Promotion modes remain locked in orchestrator v2.1. Run DRY_RUN only."
          exit 2
