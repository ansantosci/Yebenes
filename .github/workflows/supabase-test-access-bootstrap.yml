name: MAINT - Bootstrap TEST synthetic access

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Repository branch containing TEST-ACCESS scripts
        required: true
        type: choice
        options:
          - develop
          - test
        default: develop

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap TEST-ACCESS
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout selected source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}

      - name: Validate scripts and required secrets
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
          SUPABASE_TEST_PROJECT_REF: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          TEST_APP_USER_PASSWORD: ${{ secrets.TEST_APP_USER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$TEST_DB_URL"
          test -n "$SUPABASE_TEST_PROJECT_REF"
          test -n "$SUPABASE_TEST_SERVICE_ROLE_KEY"
          test -n "$TEST_APP_USER_PASSWORD"

          test -s supabase/test-support/00-test-infrastructure.sql
          test -s supabase/seed/test-access/00-test-access-personas.sql
          test -s scripts/bootstrap-test-access.mjs
          test -s scripts/bootstrap-synthetic-access.mjs

          echo "TEST-ACCESS validation completed."
          echo "Source branch: ${{ inputs.source_ref }}"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo "PostgreSQL client already available: $(psql --version)"
            exit 0
          fi
          
          for attempt in 1 2 3 4; do
            echo "Installing PostgreSQL client (attempt $attempt/4)..."
            if sudo apt-get -o Acquire::Retries=3 update && \
               sudo apt-get -o Acquire::Retries=3 install -y postgresql-client; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "ERROR: unable to install PostgreSQL client after 4 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          
          command -v psql >/dev/null 2>&1 || { echo "ERROR: psql is still unavailable after installation." >&2; exit 1; }
          psql --version
      - name: Ensure TEST dataset infrastructure
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail

          psql "$TEST_DB_URL" -X -v ON_ERROR_STOP=1 \
            -f supabase/test-support/00-test-infrastructure.sql

      - name: Create/update permanent TEST-ACCESS Personas and roles
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail

          psql "$TEST_DB_URL" -X -v ON_ERROR_STOP=1 \
            -f supabase/seed/test-access/00-test-access-personas.sql

      - name: Create/update Auth users and link Personas
        env:
          SUPABASE_TEST_URL: https://${{ secrets.SUPABASE_TEST_PROJECT_REF }}.supabase.co
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          TEST_APP_USER_PASSWORD: ${{ secrets.TEST_APP_USER_PASSWORD }}
        run: node scripts/bootstrap-test-access.mjs

      - name: Verify TEST-ACCESS links
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail

          RESULT=$(psql "$TEST_DB_URL" -X -A -t -v ON_ERROR_STOP=1 \
            -c "select count(*) || ',' || count(p.auth_user_id) from private.test_access_identities a join public.personas p on p.id=a.persona_id;")

          echo "access_identities,linked=$RESULT"

          ACCESS_COUNT="${RESULT%%,*}"
          LINKED_COUNT="${RESULT##*,}"

          if [ "$ACCESS_COUNT" != "6" ] || [ "$LINKED_COUNT" != "6" ]; then
            echo "ERROR: expected 6 TEST-ACCESS identities and 6 Auth links."
            exit 1
          fi

          echo "TEST-ACCESS validated successfully."
