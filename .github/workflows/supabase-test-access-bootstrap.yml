name: Bootstrap Supabase TEST access users
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create/update permanent TEST-ACCESS Personas and roles
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: psql "$TEST_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed/test-access/00-test-access-personas.sql
      - name: Create/update Auth users and link Personas
        env:
          SUPABASE_TEST_URL: https://${{ secrets.SUPABASE_TEST_PROJECT_REF }}.supabase.co
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          TEST_APP_USER_PASSWORD: ${{ secrets.TEST_APP_USER_PASSWORD }}
        run: node scripts/bootstrap-test-access.mjs
      - name: Verify TEST-ACCESS links
        env:
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          psql "$TEST_DB_URL" -v ON_ERROR_STOP=1 -c "select count(*) as access_identities, count(p.auth_user_id) as linked from private.test_access_identities a join public.personas p on p.id=a.persona_id;"
